name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/example/screenwaker
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p gradle/wrapper

      - name: Write settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenWaker"
          include ':app'
          EOF

      - name: Write root build.gradle
        run: |
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

      - name: Write gradle wrapper properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Write app build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.screenwaker'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.screenwaker"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }
          EOF

      - name: Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.screenwaker">
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MyNotificationListener"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Write MainActivity.kt
        run: |
          cat > app/src/main/java/com/example/screenwaker/MainActivity.kt << 'EOF'
          package com.example.screenwaker
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              private lateinit var btnGrantPermission: Button
              private lateinit var tvStatus: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  btnGrantPermission = findViewById(R.id.btnGrantPermission)
                  tvStatus = findViewById(R.id.tvStatus)
                  btnGrantPermission.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  }
              }
              override fun onResume() {
                  super.onResume()
                  if (isNotificationListenerEnabled()) {
                      tvStatus.text = "Status: GRANTED. App is active."
                      tvStatus.setTextColor(resources.getColor(android.R.color.holo_green_dark, theme))
                      btnGrantPermission.text = "Manage Notification Access"
                  } else {
                      tvStatus.text = "Status: NOT granted. Tap the button above."
                      tvStatus.setTextColor(resources.getColor(android.R.color.holo_red_dark, theme))
                      btnGrantPermission.text = "Grant Notification Access"
                  }
              }
              private fun isNotificationListenerEnabled(): Boolean {
                  val flat = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                  if (!TextUtils.isEmpty(flat)) {
                      for (name in flat.split(":")) {
                          val cn = ComponentName.unflattenFromString(name)
                          if (cn != null && packageName == cn.packageName) return true
                      }
                  }
                  return false
              }
          }
          EOF

      - name: Write MyNotificationListener.kt
        run: |
          cat > app/src/main/java/com/example/screenwaker/MyNotificationListener.kt << 'EOF'
          package com.example.screenwaker
          import android.content.Context
          import android.os.PowerManager
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          class MyNotificationListener : NotificationListenerService() {
              private val whitelist = setOf(
                  "com.whatsapp", "com.whatsapp.w4b",
                  "org.telegram.messenger", "org.telegram.messenger.web"
              )
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  super.onNotificationPosted(sbn)
                  if (!whitelist.contains(sbn.packageName)) return
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (pm.isInteractive) return
                  @Suppress("DEPRECATION")
                  val wl = pm.newWakeLock(
                      PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP,
                      "ScreenWaker:WakeLock"
                  )
                  wl.acquire(5000L)
                  android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({
                      try { if (wl.isHeld) wl.release() } catch (e: RuntimeException) {}
                  }, 5000L)
              }
          }
          EOF

      - name: Write activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center" android:padding="32dp"
              android:background="#F5F5F5">
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="Screen Waker" android:textSize="26sp" android:textStyle="bold"
                  android:textColor="#1A1A1A" android:gravity="center" android:layout_marginBottom="16dp"/>
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="Wakes screen for 5 seconds on WhatsApp or Telegram notifications while locked."
                  android:textSize="15sp" android:textColor="#555555" android:gravity="center"
                  android:lineSpacingMultiplier="1.4" android:layout_marginBottom="40dp"/>
              <Button android:id="@+id/btnGrantPermission" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="Grant Notification Access"
                  android:textSize="15sp" android:padding="14dp" android:backgroundTint="#1976D2"
                  android:textColor="#FFFFFF" android:layout_marginBottom="16dp"/>
              <TextView android:id="@+id/tvStatus" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="" android:textSize="13sp"
                  android:textColor="#888888" android:gravity="center"/>
          </LinearLayout>
          EOF

      - name: Write strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Screen Waker</string>
          </resources>
          EOF

      - name: Write colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#1976D2</color>
              <color name="colorPrimaryDark">#1565C0</color>
              <color name="colorAccent">#FF4081</color>
          </resources>
          EOF

      - name: Generate launcher icon
        run: |
          python3 -c "
          import base64
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==')
          for d in ['mipmap-hdpi','mipmap-mdpi','mipmap-xhdpi','mipmap-xxhdpi']:
              open(f'app/src/main/res/{d}/ic_launcher.png','wb').write(png)
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download gradle wrapper jar
        run: |
          curl -Lo gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar

      - name: Write gradlew script
        run: |
          cat > gradlew << 'EOF'
          #!/usr/bin/env sh
          exec java -jar "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"
          EOF
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenWaker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
