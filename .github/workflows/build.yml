name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          curl -Lo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          sudo ln -s /tmp/gradle-8.4/bin/gradle /usr/local/bin/gradle

      - name: Install Android SDK
        run: |
          curl -Lo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d $HOME/android/cmdline-tools
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>/dev/null

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/example/screenwaker
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

      - name: Create Gradle files
        run: |
          cat > settings.gradle << 'DONE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenWaker"
          include ':app'
          DONE

          cat > build.gradle << 'DONE'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          DONE

          cat > gradle.properties << 'DONE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          DONE

          cat > app/build.gradle << 'DONE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.screenwaker'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.screenwaker'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }
          DONE

      - name: Create source files
        run: |
          cat > app/src/main/AndroidManifest.xml << 'DONE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.screenwaker">
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.DISABLE_KEYGUARD"/>
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="@string/app_name" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".MyNotificationListener" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          DONE

          cat > app/src/main/java/com/example/screenwaker/MainActivity.kt << 'DONE'
          package com.example.screenwaker
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              private lateinit var btn: Button
              private lateinit var tv: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  btn = findViewById(R.id.btnGrantPermission)
                  tv = findViewById(R.id.tvStatus)
                  btn.setOnClickListener { startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) }
              }
              override fun onResume() {
                  super.onResume()
                  val enabled = isEnabled()
                  tv.text = if (enabled) "Status: GRANTED." else "Status: NOT granted."
                  tv.setTextColor(resources.getColor(if (enabled) android.R.color.holo_green_dark else android.R.color.holo_red_dark, theme))
              }
              private fun isEnabled(): Boolean {
                  val flat = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: return false
                  return flat.split(":").any { ComponentName.unflattenFromString(it)?.packageName == packageName }
              }
          }
          DONE

          cat > app/src/main/java/com/example/screenwaker/MyNotificationListener.kt << 'DONE'
          package com.example.screenwaker
          import android.content.Context
          import android.os.PowerManager
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          class MyNotificationListener : NotificationListenerService() {
              private val whitelist = setOf("com.whatsapp","com.whatsapp.w4b","org.telegram.messenger","org.telegram.messenger.web")
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (!whitelist.contains(sbn.packageName)) return
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (pm.isInteractive) return
                  @Suppress("DEPRECATION")
                  val wl = pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP, "ScreenWaker:WakeLock")
                  wl.acquire(5000L)
                  android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({ try { if (wl.isHeld) wl.release() } catch (e: RuntimeException) {} }, 5000L)
              }
          }
          DONE

          cat > app/src/main/res/layout/activity_main.xml << 'DONE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:gravity="center" android:padding="32dp" android:background="#F5F5F5">
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="Screen Waker" android:textSize="26sp" android:textStyle="bold"
                  android:textColor="#1A1A1A" android:gravity="center" android:layout_marginBottom="16dp"/>
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="Wakes screen 5 seconds on WhatsApp/Telegram notifications while locked."
                  android:textSize="15sp" android:textColor="#555555" android:gravity="center" android:layout_marginBottom="40dp"/>
              <Button android:id="@+id/btnGrantPermission" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="Grant Notification Access"
                  android:backgroundTint="#1976D2" android:textColor="#FFFFFF" android:layout_marginBottom="16dp"/>
              <TextView android:id="@+id/tvStatus" android:layout_width="match_parent"
                  android:layout_height="wrap_content" android:text="" android:textSize="13sp"
                  android:textColor="#888888" android:gravity="center"/>
          </LinearLayout>
          DONE

          cat > app/src/main/res/values/strings.xml << 'DONE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Screen Waker</string></resources>
          DONE

          python3 -c "
          import base64
          png=base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==')
          open('app/src/main/res/mipmap-hdpi/ic_launcher.png','wb').write(png)
          "

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenWaker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
